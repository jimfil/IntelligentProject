services:
  # TensorBoard service to monitor training progress
  tensorboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: safe-nav-base
    command: tensorboard --logdir runs --host 0.0.0.0 --port 6006
    ports:
      - "6006:6006"
    volumes:
      - .:/app
    restart: always

  # PPO training safety PPO
  train-safe-ppo:
    build:
      context: .
      dockerfile: Dockerfile
    image: safe-nav-base
    entrypoint: [ "python", "src/train_ppo_lagrangian.py" ]
    volumes:
      - .:/app

  # Standard unconstrained PPO baseline
  train-simple-ppo:
    build:
      context: .
      dockerfile: Dockerfile
    image: safe-nav-base
    entrypoint: [ "python", "src/train_ppo.py" ]
    volumes:
      - .:/app

  # Evaluation script
  evaluation:
    build:
      context: .
      dockerfile: Dockerfile
    image: safe-nav-base
    entrypoint: [ "python", "src/evaluation.py" ]
    command:
      - "--controller"
      - "ppo"
      - "--model-path"
      - "runs/ppo_model/best_model.zip"
      - "--obs-stats-path"
      - "runs/ppo_model/obs_stats.npz"
      - "--n-episodes"
      - "20"
      - "--smooth-actions"
      - "--action-alpha"
      - "0.8"
      - "--frame-stack"
      - "1"
    volumes:
      - .:/app

  # Interactive shell for custom commands or debugging
  shell:
    build:
      context: .
      dockerfile: Dockerfile
    image: safe-nav-base
    stdin_open: true
    tty: true
    volumes:
      - .:/app
    command: bash

  # Record high-resolution birds-eye view episodes
  record:
    build:
      context: .
      dockerfile: Dockerfile
    image: safe-nav-base
    entrypoint: [ "xvfb-run", "-a", "python", "src/record.py" ]
    volumes:
      - .:/app
